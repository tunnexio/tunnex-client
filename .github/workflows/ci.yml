# Tunnex desktop client CI.
#
# ⛔ ELECTRON IS NEVER LAUNCHED IN CI. The client's unit tests import no electron at runtime;
# typecheck and build need only its types. ELECTRON_SKIP_BINARY_DOWNLOAD keeps a ~100MB download
# out of every job — and it is why client tests must keep their pure view-models in
# electron-free modules (require("electron") throws when the binary was skipped).
name: ci

on:
  push:
    branches: [main]
    # ⛔ TAGS BUILD AND PUBLISH. The client matrix already derives its version from `refs/tags/v*`;
    # without this trigger that code was unreachable and a tag produced nothing at all.
    tags: ["v*"]
  pull_request:

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  helper:
    name: helper (vet + test + crosscompile)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: make test-helper
      - run: make helper-crosscompile

  client:
    name: client
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    outputs:
      windows-artifact-id: ${{ steps.upload-windows.outputs.artifact-id }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # ⛔ DERIVED FROM THE HELPER'S OWN go.mod. In the monorepo this read apps/api/go.mod — the Go
      # version for a module this job does not build — while caching apps/helper/go.sum. Same value
      # by luck, wrong source by construction; corrected here because apps/api no longer exists.
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/helper/go.mod
          cache-dependency-path: apps/helper/go.sum

      # WFP/wintun code is Windows-build-tagged, so only a native runner compiles it.
      - name: Helper — native Windows build + vet + test
        if: matrix.os == 'windows-latest'
        working-directory: apps/helper
        env:
          GOFLAGS: -mod=readonly
        run: |
          go build ./...
          go vet ./...
          go test ./...

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install (electron binary skipped — CI never launches it)
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Client — typecheck
        run: pnpm --filter @tunnex/client run typecheck

      - name: Client — unit tests
        run: pnpm --filter @tunnex/client test

      - name: Client — build
        run: pnpm --filter @tunnex/client build

      - name: Resolve desktop package version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(node -p 'require("./apps/client/package.json").version')"
          fi
          echo "DESKTOP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Client — package macOS installer (universal)
        if: matrix.os == 'macos-latest'
        env:
          GOFLAGS: -mod=readonly
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          pnpm --filter @tunnex/web build
          bash apps/client/scripts/stage-helper.sh mac
          pnpm --filter @tunnex/client exec electron-builder --mac --universal --config electron-builder.yml --config.extraMetadata.version="$DESKTOP_VERSION"
          bash apps/client/scripts/sha256sums.sh

      # ⛔ NATIVELY ON WINDOWS. A macOS-cross-built NSIS uninstaller fails its integrity check on Windows.
      - name: Client — package Windows installer (native)
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          GOFLAGS: -mod=readonly
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          pnpm --filter @tunnex/web build
          bash apps/client/scripts/stage-helper.sh win
          # ⛔ A RELEASE MAY NOT SHIP A WINDOWS INSTALLER THAT CANNOT TUNNEL. stage-helper.sh only WARNS
          # when vendor/wintun/wintun.dll is absent and carries on, so the installer builds green while the
          # helper has no way to create the tun adapter (apps/helper/backend_windows.go → tun.CreateTUN).
          # A silent warning is survivable on a branch build; publishing it to users is not, and a SIGNED
          # non-functional installer would be worse still — it looks trustworthy and fails anyway.
          # Branch builds keep the warning; tagged builds fail here.
          if [[ "$GITHUB_REF" == refs/tags/v* && ! -f apps/client/build/helper/wintun.dll ]]; then
            echo "::error::wintun.dll is missing — refusing to publish a Windows installer that cannot create a tun adapter. See apps/client/vendor/wintun/README.md"
            exit 1
          fi
          pnpm --filter @tunnex/client exec electron-builder --win --x64 --config electron-builder.yml --config.extraMetadata.version="$DESKTOP_VERSION"
          bash apps/client/scripts/sha256sums.sh

      - uses: actions/upload-artifact@v4
        if: matrix.os == 'macos-latest'
        with:
          name: tunnex-macos-installer
          if-no-files-found: error
          path: |
            apps/client/release/Tunnex-macOS-universal.pkg
            apps/client/release/SHA256SUMS

      - uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-latest'
        # ⚠ `id` + the job output below exist so a signing service can reference this artifact BY ID.
        # SignPath's action takes a github-artifact-id, not a name — without this the release job has
        # nothing to hand it. Harmless while signing is unconfigured.
        id: upload-windows
        with:
          name: tunnex-windows-installer
          if-no-files-found: error
          path: |
            apps/client/release/Tunnex-Windows-x64.exe
            apps/client/release/SHA256SUMS

  # ⛔ RUNS ONLY ON A TAG, AND ONLY AFTER BOTH INSTALLERS EXIST. `needs` is what makes that true:
  # a release that publishes whatever happened to build is how a half-platform release ships.
  release:
    name: release
    needs: [helper, client]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # The default token is read-only; creating a Release needs write. Scoped to this job alone.
      contents: write
    steps:
      # ⚠ FULL HISTORY. checkout defaults to a shallow clone, and `git describe --tags` then finds
      # nothing — which is how a release job silently generates notes from the wrong range.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ⛔ THE TAG AND THE SHIPPED VERSION MUST AGREE. electron-builder stamps the installer from
      # --config.extraMetadata.version, which the client job derives from the tag — so a tag that
      # disagrees with package.json publishes an artifact whose internal version contradicts the
      # release it is attached to. Cheap to check, confusing forever if it is wrong.
      - name: Tag must match apps/client/package.json version
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p 'require("./apps/client/package.json").version')"
          echo "tag: $TAG_VERSION   package.json: $PKG_VERSION"
          if [[ "$TAG_VERSION" != "$PKG_VERSION" ]]; then
            echo "::error::tag v$TAG_VERSION does not match apps/client/package.json version $PKG_VERSION — bump the manifest or retag"
            exit 1
          fi

      - name: Collect the installers built by the client matrix
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # ⛔ SIGNING IS GATED ON THE SECRET EXISTING, so this repository releases correctly while it is
      # unsigned and starts signing the moment the credentials are added — no workflow edit at that
      # point, which is the edit most likely to be made in a hurry on release day.
      #
      # ⚠ CONFIRM THESE INPUTS AGAINST SIGNPATH'S CURRENT DOCS BEFORE FIRST USE. The action's input
      # names and version are stated from documentation, not from a run of this pipeline — nobody has
      # executed this step yet. Treat the first signed release as the test of this block.
      # See docs/code-signing.md for the application process and what each value is.
      - name: Sign the Windows installer (SignPath — free for OSS)
        id: signpath
        if: env.SIGNPATH_API_TOKEN != ''
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: tunnex-client
          signing-policy-slug: release-signing
          github-artifact-id: ${{ needs.client.outputs.windows-artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-windows

      - name: Assemble assets + ONE checksum file over what actually ships
        run: |
          set -euo pipefail
          mkdir -p release
          cp artifacts/tunnex-macos-installer/Tunnex-macOS-universal.pkg release/
          # Prefer the SIGNED binary when the signing step ran; fall back to the unsigned one otherwise.
          # An explicit branch rather than a wildcard, so an unnoticed signing failure cannot quietly
          # publish the unsigned artifact under a release that claims to be signed.
          if [[ -f signed-windows/Tunnex-Windows-x64.exe ]]; then
            echo ">> using the SIGNED Windows installer"
            cp signed-windows/Tunnex-Windows-x64.exe release/
          else
            echo ">> signing not configured — publishing the UNSIGNED Windows installer"
            cp artifacts/tunnex-windows-installer/Tunnex-Windows-x64.exe release/
          fi

          # ⚠ RECOMPUTED HERE, NOT COPIED. Each matrix leg produces its own SHA256SUMS covering only its
          # own artifact. Shipping both would give a release two files of the same name, each telling half
          # the truth. One file, computed over the assets actually attached, is what a user can verify.
          cd release
          sha256sum ./* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"

          # A tag carrying a hyphen (v0.2.0-rc1, -beta) is a prerelease. Semver already encodes that; this
          # reads it rather than asking a human to remember a checkbox.
          PRERELEASE=""
          if [[ "$TAG" == *-* ]]; then PRERELEASE="--prerelease"; fi

          # ⛔ NO --notes-start-tag. It was passed as $(git describe … || echo "") — which is EMPTY on the
          # very first tag, and an empty value is not a valid argument, so the first release this pipeline
          # ever cut would have been the one that failed. `--generate-notes` derives the range itself.
          #
          # Idempotent: re-running a failed release job must not die on "release already exists".
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo ">> release $TAG exists — uploading assets with --clobber"
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" --title "$TAG" --generate-notes $PRERELEASE release/*
          fi

          echo ">> published:"; gh release view "$TAG" --json assets --jq '.assets[].name'
